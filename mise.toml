[settings]
# Keep project tools ahead of inherited PATH additions (e.g. PNPM_HOME/bin).
activate_aggressive = true
pin = true
lockfile = true
locked_verify_provenance = true
minimum_release_age = "7d"

[tools]
gum = "2.0.0"
hk = "1.56.1"
node = "26.8.1"
pnpm = "12.3.4"
zizmor = "1.30.0"

[hooks]
# Runs on every cd into the repo (requires `mise activate` in the shell, which
# the developer must configure). Installs any missing pinned tools, then (re)installs the git
# pre-commit hook so a fresh clone needs no manual step. --mise makes the hook
# itself run through `mise x`. GUI clients still need mise on PATH.
# Noninteractive bootstrap: mise install --locked && mise run setup.
enter = ["mise install --locked", "mise x -- hk install --mise"]

[tasks.check]
description = "Run types, format, lint and tests across tracked files"
run = "hk check --all --check"

[tasks.setup]
description = "Install dependencies, generate Worker types and install git hooks"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm exec wrangler types",
  "hk install --mise",
]

[tasks.fix]
description = "Run every check, applying fixes where a fixer exists"
run = "hk fix --all"

[tasks.data]
description = "Maintain tracker metadata and archives (see data/README.md)"
run = "node data/cli.ts"

[tasks."data:restore"]
description = "Restore canonical SQL; refuse an existing DB"
run = "node data/cli.ts restore"

[tasks."data:dump"]
description = "Validate and write a deterministic SQL dump for review"
run = "node data/cli.ts dump"

[tasks."data:check"]
description = "Restore/validate the dump and check working DB drift"
run = "node data/cli.ts check"

[tasks."data:notify"]
description = "Validate external SQL edits and refresh dev metadata"
run = "node data/cli.ts notify"
