[settings]
# Keep project tools ahead of inherited PATH additions (e.g. PNPM_HOME/bin).
activate_aggressive = true
pin = true
lockfile = true
locked_verify_provenance = true
minimum_release_age = "7d"

[tools]
gum = "2.0.0"
hk = "1.56.1"
node = "26.8.1"
# Mise 2026.9.1 calls the PyPI backend pipx; uvx selects uv, not pipx.
"pipx:sqlit-tui" = { version = "1.6.4", uvx = true }
pnpm = "12.3.4"
uv = "0.12.13"
zizmor = "1.30.0"

[hooks]
# Runs on every cd into the repo (requires `mise activate` in the shell, which
# the developer must configure). Installs any missing pinned tools, then (re)installs the git
# pre-commit hook so a fresh clone needs no manual step. --mise makes the hook
# itself run through `mise x`. GUI clients still need mise on PATH.
# Noninteractive bootstrap: mise install --locked && mise run setup.
enter = ["mise install --locked", "mise x -- hk install --mise"]

[tasks.check]
description = "Run types, format, lint and tests across tracked files"
run = "hk check --all --check"

[tasks.setup]
description = "Install dependencies, generate Worker types and install git hooks"
run = [
  "pnpm install --frozen-lockfile",
  # A no-op pnpm install can skip postinstall; setup still requests a fresh audit.
  "pnpm run audit",
  "pnpm exec cf workers types",
  "hk install --mise",
]

[tasks.fix]
description = "Run every check, applying fixes where a fixer exists"
run = "hk fix --all"

[tasks."kv:seed-preview"]
description = "Copy the latest season's preview Showdown cache into local KV (run after pnpm start)"
dir = "{{config_root}}"
# Band-aid for local workerd's NBA fetching failures; remote KV is read-only.
run = '''
set -eu
season=$(node data/cli.ts latest-season)
snapshot=$(mktemp "${TMPDIR:-/tmp}/nba-preview-schedule.XXXXXX")
trap 'rm -f "$snapshot"' EXIT
# Namespace IDs from cloudflare.config.ts; local writes must use the base binding's ID.
pnpm exec cf kv keys get "${season}:schedule" \
  --namespace-id 6a0d30705c634691873dd1dd122969e3 > "$snapshot"
pnpm exec cf kv keys put "${season}:schedule" \
  --namespace-id 6061594acc5c4fb6b3846b0c78f9e5a3 \
  --local --persist-to .cloudflare/state --file "$snapshot"
'''

[tasks.data]
description = "Generic dispatch for data commands; requires subcommand e.g. mise run data -- cmd (see data/README.md)"
run = "node data/cli.ts"

[tasks."data:migrate"]
description = "Apply new migrations to existing db"
run = "node data/cli.ts migrate"

[tasks."data:reset"]
description = "Hard reset to the canonical dump (throws away existing db)"
run = '''
# Permanently discard the working DB and SQLite sidecar files
rm -f data/tracker.db data/tracker.db-wal data/tracker.db-shm \
    data/tracker.db-journal data/tracker.db.revision

# Recreate from committed data/dump.sql, including migrations and venue backfill
mise run data:restore
'''

[tasks."data:restore"]
description = "Restore canonical SQL; refuse an existing DB"
run = "node data/cli.ts restore"

[tasks."data:sqlit"]
description = "Open the existing working database in sqlit (edits require data:notify)"
dir = "{{config_root}}"
raw = true
run = '''
if [ ! -f data/tracker.db ]; then
  echo "Missing data/tracker.db; run mise run data:restore explicitly" >&2
  exit 1
fi
exec sqlit connect sqlite --file-path "$PWD/data/tracker.db" --name "NBA tracker (working DB)" --alert write
'''

[tasks."data:dump"]
description = "Validate and write a deterministic SQL dump for review"
run = "node data/cli.ts dump"

[tasks."data:check"]
description = "Restore/validate the dump and check working DB drift"
run = "node data/cli.ts check"

[tasks."data:notify"]
description = "Validate external SQL edits and refresh dev metadata"
run = "node data/cli.ts notify"
