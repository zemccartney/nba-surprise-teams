[settings]
pin = true
lockfile = true
locked_verify_provenance = true
minimum_release_age = "7d"

[tools]
hk = "1.56.1"
node = "26.8.1"
pnpm = "12.3.4"

[hooks]
# Runs on every cd into the repo (requires `mise activate` in the shell, which
# ~/.zshrc has). Installs any missing pinned tools, then (re)installs the git
# pre-commit hook so a fresh clone needs no manual step. --mise makes the hook
# itself run through `mise x`, so it works from GUI git clients too. Both
# commands are silent no-ops once done.
enter = ["mise install --locked", "mise x -- hk install --mise"]

[tasks.check]
description = "Run every check across the whole repo (same command CI would run)"
run = "hk check --all"

[tasks.fix]
description = "Run every check, applying fixes where a fixer exists"
run = "hk fix --all"
