# Deploys native branch Previews with test KV under the same Worker; only main
# can deploy production. Automatic publishing remains gated during cutover.
# Explicit manual dispatches can publish previews or main-only production.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUBLIC_SENTRY_DSN and
# SENTRY_AUTH_TOKEN as repository secrets, and a real GAMES_KV id in
# wrangler.jsonc.
name: deploy

on:
  workflow_dispatch:
    inputs:
      production_deploy:
        description: Publish production from main (coordinated cutover only)
        type: boolean
        default: false
      preview_deploy:
        description: Publish a native branch Preview (non-main branches only)
        type: boolean
        default: false
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      startsWith(github.ref, 'refs/heads/') &&
      (vars.DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.preview_deploy && github.ref != 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.production_deploy && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
          install_args: --locked
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy selected branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          PREVIEW_DEPLOY: ${{ inputs.preview_deploy || false }}
          PRODUCTION_DEPLOY: ${{ inputs.production_deploy || false }}
        run: |
          # Separate assignment preserves a classifier failure under bash -e.
          # JavaScript comparisons are case-sensitive, unlike GitHub expressions.
          PUBLIC_DEPLOY_ENV="$(node scripts/deployment-target.ts "$GITHUB_REF")"
          export PUBLIC_DEPLOY_ENV
          # Native Previews target the top-level Worker, not a named Wrangler env.
          unset CLOUDFLARE_ENV PUBLIC_PREVIEW_ORIGIN
          if [[ "$PRODUCTION_DEPLOY" == true && "$PUBLIC_DEPLOY_ENV" != production ]]; then
            echo "Manual production publishing requires main" >&2
            exit 1
          fi
          if [[ "$PUBLIC_DEPLOY_ENV" == preview ]]; then
            PREVIEW_NAME="$(node scripts/preview-alias.ts nba-surprise-teams)"
            export PUBLIC_PREVIEW_ORIGIN="https://${PREVIEW_NAME}-nba-surprise-teams.zemccartney.workers.dev"
          elif [[ "$PREVIEW_DEPLOY" == true ]]; then
            echo "Manual preview publishing cannot target production" >&2
            exit 1
          fi
          pnpm run build
          if [[ "$PUBLIC_DEPLOY_ENV" == production ]]; then
            node scripts/assert-production-target.ts dist/server/wrangler.json
            pnpm exec wrangler deploy
          else
            node scripts/assert-preview-target.ts dist/server/wrangler.json
            # Ignore dashboard base bindings; the inspected config is authoritative.
            pnpm exec wrangler preview --name "$PREVIEW_NAME" --ignore-base-config
          fi
