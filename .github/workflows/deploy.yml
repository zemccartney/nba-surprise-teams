# Deploys the Worker build: a safe, hashed preview alias for branches,
# a production release only for refs/heads/main. Inert until the repository
# variable DEPLOY_ENABLED is set to "true" (Settings -> Secrets and variables
# -> Actions -> Variables), so pushing this file does not touch Cloudflare.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUBLIC_SENTRY_DSN and
# SENTRY_AUTH_TOKEN as repository secrets, and a real GAMES_KV id in
# wrangler.jsonc.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
          install_args: --locked
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy selected branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Separate assignment preserves a classifier failure under bash -e.
          # JavaScript comparisons are case-sensitive, unlike GitHub expressions.
          PUBLIC_DEPLOY_ENV="$(node scripts/deployment-target.ts "$GITHUB_REF")"
          export PUBLIC_DEPLOY_ENV
          pnpm run build
          if [[ "$PUBLIC_DEPLOY_ENV" == production ]]; then
            pnpm exec wrangler deploy
          else
            ALIAS="$(node scripts/preview-alias.ts)"
            pnpm exec wrangler versions upload --preview-alias "$ALIAS"
          fi
