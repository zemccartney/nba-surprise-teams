# Deploys the Worker build: a preview version aliased to the branch name for
# any branch, a production release for main. Inert until the repository
# variable DEPLOY_ENABLED is set to "true" (Settings -> Secrets and variables
# -> Actions -> Variables), so pushing this file does not touch Cloudflare.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUBLIC_SENTRY_DSN and
# SENTRY_AUTH_TOKEN as repository secrets, and a real GAMES_KV id in
# wrangler.jsonc.
name: deploy

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy preview
        if: github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
          PUBLIC_DEPLOY_ENV: preview
        run: |
          pnpm run build
          pnpm exec wrangler versions upload --preview-alias "$BRANCH"
      - name: Build and deploy production
        if: github.ref_name == 'main'
        env:
          PUBLIC_DEPLOY_ENV: production
        run: |
          pnpm run build
          pnpm exec wrangler deploy
