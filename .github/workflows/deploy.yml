# Deploys the Worker build: a safe, hashed preview alias for branches,
# a production release only for refs/heads/main. Automatic deployment stays
# gated by DEPLOY_ENABLED. A manual preview_deploy dispatch from a non-main
# branch can bootstrap/update the isolated preview Worker without opening that gate.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUBLIC_SENTRY_DSN and
# SENTRY_AUTH_TOKEN as repository secrets, and a real GAMES_KV id in
# wrangler.jsonc.
name: deploy

on:
  workflow_dispatch:
    inputs:
      preview_deploy:
        description: Deploy the isolated preview Worker (non-main branches only)
        type: boolean
        default: false
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      startsWith(github.ref, 'refs/heads/') &&
      (vars.DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.preview_deploy && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
          install_args: --locked
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy selected branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          PREVIEW_DEPLOY: ${{ inputs.preview_deploy || false }}
        run: |
          # Separate assignment preserves a classifier failure under bash -e.
          # JavaScript comparisons are case-sensitive, unlike GitHub expressions.
          PUBLIC_DEPLOY_ENV="$(node scripts/deployment-target.ts "$GITHUB_REF")"
          export PUBLIC_DEPLOY_ENV
          if [[ "$PUBLIC_DEPLOY_ENV" == preview ]]; then
            export CLOUDFLARE_ENV=preview
          elif [[ "$PREVIEW_DEPLOY" == true ]]; then
            echo "Manual preview publishing cannot target production" >&2
            exit 1
          fi
          pnpm run build
          if [[ "$PUBLIC_DEPLOY_ENV" == production ]]; then
            pnpm exec wrangler deploy
          else
            node scripts/assert-preview-target.ts dist/server/wrangler.json
            if [[ "$PREVIEW_DEPLOY" == true ]]; then
              pnpm exec wrangler deploy --env preview
            else
              ALIAS="$(node scripts/preview-alias.ts)"
              pnpm exec wrangler versions upload --env preview --preview-alias "$ALIAS"
            fi
          fi
