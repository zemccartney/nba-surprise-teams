# Deploys native branch Previews with test KV under the same Worker; only main
# can deploy production. Manual retries use the same branch selection and guards.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUBLIC_SENTRY_DSN and
# SENTRY_AUTH_TOKEN as repository secrets, and a real GAMES_KV id in
# wrangler.jsonc.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

# Serialize each branch without interrupting an in-flight publication.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      startsWith(github.ref, 'refs/heads/') && github.event.deleted != true
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
          install_args: --locked
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy selected branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Separate assignment preserves a classifier failure under bash -e.
          # JavaScript comparisons are case-sensitive, unlike GitHub expressions.
          PUBLIC_DEPLOY_ENV="$(node scripts/deployment-target.ts "$GITHUB_REF")"
          export PUBLIC_DEPLOY_ENV
          # Native Previews target the top-level Worker, not a named Wrangler env.
          unset CLOUDFLARE_ENV PUBLIC_PREVIEW_ORIGIN
          if [[ "$PUBLIC_DEPLOY_ENV" == preview ]]; then
            PREVIEW_NAME="$(node scripts/preview-alias.ts nba-surprise-teams)"
            export PUBLIC_PREVIEW_ORIGIN="https://${PREVIEW_NAME}-nba-surprise-teams.zemccartney.workers.dev"
          fi
          pnpm run build
          if [[ "$PUBLIC_DEPLOY_ENV" == production ]]; then
            node scripts/assert-production-target.ts dist/server/wrangler.json
            pnpm exec wrangler deploy
          else
            node scripts/assert-preview-target.ts dist/server/wrangler.json
            # Ignore dashboard base bindings; the inspected config is authoritative.
            pnpm exec wrangler preview --name "$PREVIEW_NAME" --ignore-base-config
          fi
